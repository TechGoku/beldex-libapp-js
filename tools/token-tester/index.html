<!doctype html>
<meta charset="utf-8">
<title>Private token tester</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; max-width: 820px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { opacity: .7; margin-bottom: 20px; }
  fieldset { border: 1px solid #8884; border-radius: 8px; margin: 0 0 16px; padding: 12px 16px; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; margin: 8px 0 2px; font-size: 12px; opacity: .8; }
  input[type=text] { width: 100%; padding: 6px 8px; font: 12px/1.4 ui-monospace, monospace;
    border: 1px solid #8886; border-radius: 6px; background: transparent; color: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { padding: 8px 16px; border-radius: 6px; border: 1px solid #8886; cursor: pointer;
    background: #4a7; color: #fff; font-weight: 600; }
  button[disabled] { opacity: .5; cursor: default; }
  button.secondary { background: transparent; color: inherit; font-weight: 400; }
  pre { background: #8881; border-radius: 8px; padding: 12px; overflow-x: auto;
    font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
  .warn { color: #c62; }
  .ok { color: #4a7; font-weight: 600; }
  .bad { color: #c44; font-weight: 600; }
</style>

<h1>Private token tester</h1>
<div class="sub">Registers an HF22 private token through the WASM library against a live light wallet server.</div>

<fieldset>
  <legend>Wallet</legend>
  <button class="secondary" id="gen">Generate a new testnet wallet</button>
  <label>Address</label><input type="text" id="addr">
  <div class="row">
    <div><label>Private view key</label><input type="text" id="view"></div>
    <div><label>Private spend key</label><input type="text" id="spend"></div>
  </div>
  <label>Public spend key</label><input type="text" id="pubspend">
  <p><button class="secondary" id="login">Log in / register with LWS</button>
     <button class="secondary" id="bal">Check balance</button></p>
</fieldset>

<fieldset>
  <legend>Token descriptor</legend>
  <div class="row">
    <div><label>Ticker (1-14 alphanumeric)</label><input type="text" id="ticker" value="DEMO"></div>
    <div><label>Decimal point (0-18)</label><input type="text" id="dp" value="8"></div>
  </div>
  <label>Full name</label><input type="text" id="fullname" value="Demo Token">
  <div class="row">
    <div><label>Initial supply</label><input type="text" id="supply" value="1000"></div>
    <div><label>Max supply</label><input type="text" id="maxsupply" value="1000000"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Run</legend>
  <p class="warn">Registration locks 10,000 BDX for 518,400 blocks. Broadcasting is irreversible.</p>
  <label><input type="checkbox" id="broadcast"> broadcast the transaction (leave off to build only)</label>
  <p><button id="run" disabled>Register token</button></p>
</fieldset>

<pre id="log">loading WASM module…</pre>

<script src="/libapp_js/BeldexLibAppCpp_WASM.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = (m, cls) => {
  const line = cls ? `<span class="${cls}">${m}</span>` : m;
  $("log").innerHTML += (typeof m === "string" ? line : JSON.stringify(m, null, 2)) + "\n";
};
const lws = async (ep, body) => {
  const r = await fetch("/lws/" + ep, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
};

let M = null;
BeldexLibAppCpp().then(mod => {
  M = mod;
  $("log").textContent = "module ready\n";
  $("run").disabled = false;
  wire();
});

function creds() {
  return { addr: $("addr").value.trim(), view: $("view").value.trim(),
           spend: $("spend").value.trim(), pubspend: $("pubspend").value.trim() };
}

function wire() {
  $("gen").onclick = () => {
    const w = JSON.parse(M.newly_created_wallet("en-US", "TESTNET"));
    $("addr").value = w.address; $("view").value = w.privateViewKey;
    $("spend").value = w.privateSpendKey; $("pubspend").value = w.publicSpendKey;
    log("generated " + w.address);
  };
  $("login").onclick = async () => {
    const c = creds();
    log(await lws("login", { address: c.addr, view_key: c.view,
                             create_account: true, generated_locally: true }));
  };
  $("bal").onclick = async () => {
    const c = creds();
    const r = await lws("get_address_info", { address: c.addr, view_key: c.view });
    log("received " + (Number(r.total_received || 0) / 1e9) + " BDX, sent " +
        (Number(r.total_sent || 0) / 1e9) + " BDX, scanned to " + r.scanned_height);
  };
  $("run").onclick = () => register();
}

function register() {
  const c = creds();
  const broadcast = $("broadcast").checked;
  $("run").disabled = true;
  $("log").textContent = "";
  const finish = () => { $("run").disabled = false; };

  const STEPS = {1:"initiating",2:"fetching balance",3:"calculating fee",
                 4:"fetching decoys",5:"constructing",6:"submitting"};
  M.fromCpp__SendFundsFormSubmission__status_update = p => log("step: " + (STEPS[p.code] || p.code));
  M.fromCpp__SendFundsFormSubmission__willBeginSending = () => log("begin sending");
  M.fromCpp__SendFundsFormSubmission__canceled = () => { log("canceled", "bad"); finish(); };
  M.fromCpp__SendFundsFormSubmission__authenticate = () =>
    M.send_cb__authentication(JSON.stringify({ did_pass: true }));

  M.fromCpp__SendFundsFormSubmission__error = p => {
    // needMoreMoneyThanFound reports the two balances; show them in BDX since
    // the interesting case is the 10,000 collateral plus fee.
    if (p.required_balance)
      log("need " + (Number(p.required_balance) / 1e9) + " BDX, have " +
          (Number(p.spendable_balance) / 1e9) + " BDX", "bad");
    else log("error: " + JSON.stringify(p), "bad");
    finish();
  };
  M.fromCpp__SendFundsFormSubmission__success = p => {
    log("token id: " + p.token_id, "ok");
    log("fee: " + (Number(p.used_fee) / 1e9) + " BDX");
    log("collateral locked: " + (Number(p.final_total_wo_fee) / 1e9) + " BDX");
    log("tx hash: " + p.tx_hash);
    log(broadcast ? "BROADCAST" : "built, not broadcast", "ok");
    finish();
  };

  M.fromCpp__SendFundsFormSubmission__get_unspent_outs = async rp => {
    // The bridge hands everything over as strings; these two must be converted
    // or the server rejects the request outright.
    const r = await lws("get_unspent_outs", { address: c.addr, view_key: c.view,
      amount: rp.amount, dust_threshold: rp.dust_threshold,
      use_dust: rp.use_dust === "true" || rp.use_dust === true,
      mixin: parseInt(rp.mixin, 10) });
    log("lws: fork_version=" + r.fork_version + " height=" + r.blockchain_height +
        " outputs=" + (r.outputs || []).length);
    M.send_cb_I__got_unspent_outs(JSON.stringify({ res: r }));
  };
  M.fromCpp__SendFundsFormSubmission__get_random_outs = async rp => {
    const r = await lws("get_random_outs", { amounts: rp.amounts, count: parseInt(rp.count, 10) });
    M.send_cb_II__got_random_outs(JSON.stringify({ res: r }));
  };
  M.fromCpp__SendFundsFormSubmission__submit_raw_tx = async rp => {
    log("tx size: " + (rp.tx || "").length / 2 + " bytes");
    if (!broadcast) { M.send_cb_III__submitted_tx(JSON.stringify({})); return; }
    const r = await lws("submit_raw_tx", { address: c.addr, view_key: c.view, tx: rp.tx });
    log("daemon: " + JSON.stringify(r));
    M.send_cb_III__submitted_tx(JSON.stringify({ res: r }));
  };

  M.send_funds(JSON.stringify({
    isRegisterStr: false,
    is_deploy_token: true,
    token_descriptor: {
      ticker: $("ticker").value, full_name: $("fullname").value, meta_info: "",
      decimal_point: $("dp").value,
      total_max_supply: $("maxsupply").value, current_supply: $("supply").value },
    fromWallet_didFailToInitialize: false, fromWallet_didFailToBoot: false,
    fromWallet_needsImport: false, requireAuthentication: false,
    is_sweeping: false, priority: "1", hasPickedAContact: false,
    nettype_string: "TESTNET",
    from_address_string: c.addr, sec_viewKey_string: c.view,
    sec_spendKey_string: c.spend, pub_spendKey_string: c.pubspend,
    destinations: [], resolvedAddress_fieldIsVisible: false,
    manuallyEnteredPaymentID_fieldIsVisible: false, resolvedPaymentID_fieldIsVisible: false
  }));
}
</script>
